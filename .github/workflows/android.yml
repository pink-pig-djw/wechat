name: Android APK

on:
  push:
    branches: [main, claude/stoic-keller-b6nett]
    paths:
      - client/**
      - package-lock.json
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      server_url:
        description: 'App 连接的服务器地址（留空则使用 capacitor.config.json 里的地址）'
        required: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      SERVER_URL: ${{ inputs.server_url || vars.PAOPAO_SERVER_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Use a different server (optional)
        if: env.SERVER_URL != ''
        run: |
          node -e "const fs=require('fs');const f='client/capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.server.url=process.env.SERVER_URL;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          sed -i "s#https://weiliao-production.up.railway.app#${SERVER_URL}#" client/public/offline.html

      - name: Build web assets and sync the Android project
        working-directory: client
        run: |
          npm run build
          npx cap sync android

      - name: Build signed release APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp client/android/app/build/outputs/apk/release/app-release.apk "out/paopao-1.0.${VERSION_CODE}.apk"
          cp client/android/app/build/outputs/apk/release/app-release.apk out/paopao.apk

      - uses: actions/upload-artifact@v4
        with:
          name: paopao-android-1.0.${{ github.run_number }}
          path: out/paopao-1.0.*.apk

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: 泡泡 Android 安装包（最新版）
          prerelease: true
          make_latest: false
          files: out/paopao.apk
          body: |
            📱 在安卓手机上下载下面的 **paopao.apk** 安装即可（需要允许“安装未知来源应用”）。

            - 版本：1.0.${{ github.run_number }}
            - 提交：${{ github.sha }}
            - 新版本可以直接覆盖安装，聊天记录保存在服务器上，不会丢失。
